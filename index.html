 ['dunkel','뮌헨 둔켈','Munich Dunkel','lager','대체로 4–6%','#8c4b27',[5,1,2,0,3],'토스트와 빵껍질, 둥근 몰트. 커피 같은 강한 로스트는 절제된다.','Ayinger Altbairisch Dunkel','밝은 몰트가 보편화되기 전 바이에른의 어두운 라거 전통을 보여준다. 검은색을 곧바로 스타우트로 읽으면 이 계보가 사라진다.','헬레스와의 차이를 색보다 빵껍질·토스트에서 찾자.','darklager',false],
 ['schwarz','슈바르츠비어','Schwarzbier','lager','대체로 4–5%','#40362c',[3,2,3,0,2],'짙은 색, 가벼운 로스트, 비교적 산뜻한 몸체.','Köstritzer Schwarzbier','독일의 검은 라거 전통. 포터·스타우트와 발효 배경이 다르며 색이 진해도 무겁거나 고도수일 필요가 없다.','검은 맥주인데도 가볍게 느껴지는 이유를 생각한다.','darklager',false],
 ['marzen','메르첸','Märzen','lager','대체로 5–6%','#b77936',[5,2,1,0,3],'호박색, 토스트, 풍성한 몰트.','Ayinger Oktober Fest-Märzen','서늘한 계절의 양조와 저장이라는 배경을 가진 축제 라거. 현대 옥토버페스트의 밝은 Festbier와 구분해야 한다.','Festbier와 색·토스트·질감을 비교한다.','bjcp',false],
 ['festbier','페스트비어','Festbier','lager','대체로 5–6%','#cda64f',[4,2,0,0,3],'밝은 금색, 헬레스보다 든든한 몰트와 도수.','Weihenstephaner Festbier · Paulaner Oktoberfest Bier','축제에서 반복해 마시기 좋은 밝은 라거로 자리 잡았다. 메르첸과 연관되지만 동일한 이름의 대체어는 아니다.','강한 헬레스와 토스트 풍미의 메르첸 사이에서 위치를 잡자.','helles',false],
 ['bock','복 · 도펠복','Bock / Doppelbock','lager','대체로 6–10%','#864924',[5,1,1,0,5],'농축된 빵·몰트·말린 과일. 도펠복은 한층 깊다.','Einbecker Ur-Bock · Ayinger Celebrator · Paulaner Salvator','복은 아인베크의 양조 전통과 뮌헨의 재해석을 잇는다. 도펠복은 수도원과 강한 몰트 맥주의 역사도 품고 있다. 밝은 버전도 존재한다.','임페리얼 스타우트와 비교하면 로스트 없이 생기는 깊이를 배운다.','bock',false],
 ['rauch','라우흐비어','Rauchbier','lager','제품별','#9d652e',[4,2,1,0,3],'훈연 몰트에서 오는 장작·햄 같은 향.','Schlenkerla Märzen','맥아 건조에 연기가 개입하던 역사를 밤베르크가 보존했다. 훈연은 여러 기본 스타일 위에 붙을 수 있다.','위스키의 피트 연기와 연료·곡물 처리의 차이를 비교하자.','bjcp',false],

 ['weiss','바이스비어','Weissbier / Hefeweizen','yeast','대체로 4–6%','#cda756',[3,1,0,1,3],'바나나·정향과 부드러운 밀 질감.','Weihenstephaner Hefeweissbier · Schneider Weisse','남독일의 밀맥주 전통. 바나나와 정향 향은 일반적으로 바나나·정향 첨가보다 효모의 발효에서 나온다.','벨기에 Witbier의 오렌지·고수씨와 원인을 나눠 기록한다.','bjcp',false],
 ['wit','벨기에 밀맥주','Witbier','yeast','대체로 4–6%','#d1c58f',[2,1,0,1,2],'시트러스·고수씨와 가벼운 밀의 질감.','Hoegaarden · St. Bernardus Wit','벨기에의 밀·향신료 전통을 잇고 현대에 부흥한 스타일. 독일 바이스비어와 같은 밀맥주라도 향을 설계하는 방식이 다르다.','밀 사용량만 보지 말고 효모와 향신료를 따로 본다.','bjcp',false],
 ['bitter','비터 · 영국 페일 에일','Bitter / English Pale Ale','hop','대체로 3–6%','#b48a42',[4,3,0,0,2],'비스킷·약한 과실과 흙·꽃 계열 홉의 균형.','Fuller’s London Pride · Timothy Taylor Landlord','밝게 건조한 몰트, 지역 홉, 펍의 캐스크 에일 문화가 함께 만든 계열. 이름이 Bitter라고 현대 IPA보다 더 쓴 것은 아니다.','강한 향보다 몰트와 홉이 번갈아 나타나는 균형을 본다.','bjcp',false],
 ['apa','아메리칸 페일 에일','American Pale Ale','hop','대체로 4.5–6%','#c7963e',[3,4,0,0,3],'감귤·솔향 홉과 받쳐주는 몰트.','Sierra Nevada Pale Ale','미국 크래프트 부흥에서 미국산 홉의 향을 일상적인 맥주로 정착시켰다. Sierra Nevada Pale Ale은 1980년부터 중요한 기준점이다.','영국 페일 에일과 홉 향의 어휘를 비교한다.','bjcp',false],
 ['west','웨스트코스트 IPA','West Coast IPA','hop','대체로 6–8%','#c39433',[2,5,0,0,2],'감귤 껍질·솔·수지, 또렷한 쓴맛과 마른 마무리.','Ballast Point Sculpin · Stone IPA','미국 서부에서 홉 향과 드라이한 마무리를 강조한 흐름이다. Sculpin은 7%, 70 IBU의 대표적인 샌디에이고 사례.','과일을 넣지 않아도 과일 향이 날 수 있다. 향과 쓴맛을 따로 기록한다.','sculpin',true],
 ['dipa','더블 IPA','Double / Imperial IPA','hop','대체로 7.5–10%','#b1822b',[3,5,0,0,4],'홉의 밀도와 알코올을 높이되 마무리의 균형이 관건.','Russian River Pliny the Elder','Pliny the Elder는 2000년 DIPA 행사에서 시작했다. DIPA는 강도의 축이어서 West Coast·Hazy와 교차할 수 있다.','고도수라는 이유만으로 홉이 더 거칠어야 하는 것은 아니다.','pliny',false],

 ['imperial','임페리얼 스타우트','Imperial Stout / RIS','dark','대체로 8–12%+','#2d2723',[5,3,5,0,5],'카카오·에스프레소·검은 과일과 큰 몸체.','Samuel Smith Imperial Stout · Old Rasputin · Yeti · Bell’s Expedition · Ten Fidy','강한 영국 포터·스타우트의 수출 역사, 특히 러시아·발트해 시장과 연결된다. 미국 크래프트가 도수·홉·로스트를 확장했다.','배럴에 들어가기 전 기본 맥주가 어떤 맛인지 먼저 익힌다.','stout',true],

 ['ba','배럴 숙성 임페리얼 스타우트','Barrel-Aged Imperial Stout','dark','제품·빈티지별','#3c2a23',[5,2,5,0,5],'로스트 위에 바닐라·오크·증류주 향이 겹친다.','Goose Island Bourbon County · Firestone Walker Parabola · The Bruery Black Tuesday','미국의 버번 배럴 활용이 현대 BA 스타우트를 크게 확장했다. Barrel-aged는 기본 스타일 위에 적용하는 공정이다.','배럴 향, 베이스 맥주, 단맛, 알코올이 얼마나 자연스럽게 이어지는가?','bruery',true],
 ['pastry','페이스트리 스타우트','Pastry / Dessert Stout','dark','제품별','#4b3026',[5,1,4,0,5],'디저트를 연상시키는 농도와 재료의 조합.','Bottle Logic · WeldWerks Medianoche 변형 · The Bruery 디저트 변형','현대 크래프트에서 바닐라·코코넛·카카오·커피·메이플 등을 적극 사용한다. 모든 페이스트리가 배럴 숙성이거나 모든 BA가 페이스트리는 아니다.','바닐라빈 첨가와 오크의 바닐라 향은 라벨·양조 정보로 구분한다.','firestone',false],

 ['tripel','트리펠 · 골든 스트롱','Tripel / Belgian Golden Strong','yeast','대체로 7.5–10.5%','#d8ba59',[3,2,0,0,3],'밝은 색, 높은 도수, 효모의 과실·향신료와 드라이함.','Westmalle Tripel · Duvel','Westmalle의 현대 트리펠과 Duvel식 골든 스트롱은 닮았지만 다른 스타일이다. 트리펠은 상대적으로 몰트·향신료의 무게를 더 느낄 수 있다.','색이 밝다는 이유로 도수가 낮다고 추측하지 않는다.','belgian',false],

const BEER_LESSONS=[
 {id:'b1',title:'지도 읽기 — 발효, 재료, 공정을 겹쳐 보기',sub:'에일 · 라거 · 혼합발효를 한 줄짜리 족보로 읽지 않기',source:['bjcp','helles','gueuze'],body:`
<p>맥주 스타일은 한 조상에서 차례로 갈라진 완벽한 족보가 아니다. 효모, 몰트, 홉, 발효·숙성 기술, 지역 문화가 서로 교차하면서 이름과 맛이 바뀌었다. 같은 이름도 시대와 나라에 따라 범위가 다르다. 이 지도는 역사적 영향 관계와 오늘날의 비교 관계를 함께 보여주되, 둘을 구별해서 읽도록 구성했다.</p>
<p>에일과 라거는 주로 사용하는 효모와 발효 관행을 구분하는 출발점이다. 에일은 흔히 상면발효, 라거는 하면발효라고 설명하지만, 실제 향미를 알려면 효모 균주와 온도·숙성까지 봐야 한다. 깨끗한 맛의 에일인 쾰쉬, 어두운 라거인 둔켈·슈바르츠비어가 단순한 색·맛 구분의 반례다.</p>
<p>야생·혼합발효는 효모와 박테리아를 다루는 또 하나의 축이다. Brettanomyces 효모의 건초·가죽 같은 향, 젖산균 등이 만드는 산미, 자연발효와 배양균 접종을 구분하자. 세종이 언제나 시거나, 고제가 모두 람빅처럼 장기 자연발효되는 것은 아니다.</p>
<div class="route"><span>기본 스타일</span><i>＋</i><span>발효 선택</span><i>＋</i><span>숙성 · 재료</span><i>＝</i><span>최종 맥주</span></div>
<p>Barrel-aged(배럴 숙성), coffee, vanilla, fruit, smoked, dry-hopped는 여러 기본 스타일 위에 올라갈 수 있다. 임페리얼 스타우트를 버번통에 넣으면 BA Imperial Stout, 발리와인을 넣으면 BA Barleywine이다. Pastry는 디저트 같은 표현을 가리키는 말이며 BA와 동의어가 아니다.</p>
<p>헬레스와 BA 임스를 이어주는 관심은 시간과 균형이다. 하나는 발효·몰트의 작은 차이를, 다른 하나는 몰트·로스트·알코올·통의 복잡한 결합을 보게 한다. 절제와 농도를 모두 관찰하는 좋은 출발점이다.</p>`},
 {id:'b2',title:'라거의 역사 — 어두운 바이에른과 금빛 플젠',sub:'Dunkel · Pilsner · Helles가 각자 지킨 것',source:['pils','spaten','czech','darklager'],body:`
<p>바이에른의 라거 전통에서는 어두운 몰트의 맥주가 중요한 위치를 차지했다. 차가운 발효와 저장에 밝게 건조한 몰트 기술이 결합하면서 19세기 중부유럽의 라거 풍경이 달라진다. 산업화, 온도 관리, 균일한 원료 생산도 이 변화를 뒷받침했다.</p>
<p>1842년 플젠에서 Josef Groll이 만든 Pilsner Urquell은 황금색 라거의 큰 전환점이었다. 밝은 색의 충격에 더해 몰트와 Saaz 계열 홉, 부드러운 질감과 분명한 쓴맛이 결합했다. 맑고 밝은 라거의 성공은 독일을 비롯한 여러 지역으로 퍼졌다.</p>
<p>독일 필스는 이를 자기 지역의 조건과 취향으로 재해석했다. Jever·Bitburger를 체코 필스너와 비교하면 드라이함, 홉의 위치, 둥근 질감의 차이가 읽힌다. 다만 모든 독일 필스·체코 라거가 한 가지 맛을 내는 것은 아니다. 체코에는 밝은·호박색·어두운 라거와 여러 원맥즙 농도 등급이 있다.</p>
<p>뮌헨의 Spaten은 1894년 밝은 헬레스를 선보였다. Pilsner의 성공에 대응하면서도 바이에른의 몰트 중심 균형을 유지했다. ‘Dunkel → Pilsner의 영향 → Helles’는 변화의 배경을 이해하는 관계도이며, 둔켈이라는 한 제품이 필스너로 변했다는 뜻은 아니다.</p>
<div class="two-col"><div class="mini-card"><h4>필스너가 앞세우는 것</h4><p>선명한 홉, 쓴맛과 청량한 마무리. 체코와 독일의 표현도 비교할 수 있다.</p></div><div class="mini-card"><h4>헬레스가 지키는 것</h4><p>밝은 몰트의 빵·곡물 향, 부드러운 질감, 뒤에서 받치는 홉과 마른 끝맛.</p></div></div>
<p>20세기 대형 양조장의 페일 라거가 세계적으로 확산하면서 ‘맥주=밝은 라거’라는 이미지가 강해졌다. 그래서 현대 크래프트의 라거 회귀는 단순한 복고만이 아니라, 익숙한 맥주 안의 발효·숙성 차이를 다시 배우는 과정이기도 하다.</p>`},
 {id:'b3',title:'헬레스의 이웃 — 색, 몰트, 도수의 다른 갈림길',sub:'Dunkel · Märzen · Festbier · Bock · Doppelbock',source:['helles','darklager','bock'],body:`
<p>헬레스가 좋다면 먼저 필스너·둔켈·페스트비어로 넓히자. 필스너는 홉의 존재감, 둔켈은 빵껍질과 토스트, 페스트비어는 더 든든한 몰트와 도수를 보여준다. 헬레스의 몰티함은 잔당이 많다는 말과 다르다. 달콤한 빵 향이 나면서도 끝은 드라이할 수 있다.</p>
<p>메르첸은 호박색·토스트·몰트의 인상을 읽기 좋고, 오늘날 축제장의 밝은 Festbier와는 구분된다. ‘옥토버페스트 맥주’라는 이름만으로 색과 스타일을 확정하지 말자. Vienna Lager도 이 19세기 밝아지는 몰트·호박색 라거의 세계에서 함께 볼 이웃이다.</p>
<p>복과 도펠복은 몰트의 농도와 도수가 높아지는 방향을 보여준다. Einbecker로 복의 배경을, Ayinger Celebrator·Paulaner Salvator로 도펠복의 깊이를 비교할 수 있다. 검은 스타우트의 커피 로스트 없이도 강한 맥주가 깊고 복합적일 수 있다는 점이 중요하다.</p>
<p>Spaten은 헬레스 역사, Augustiner Lagerbier Hell은 뮌헨의 일상적 기준, Weihenstephaner Original Helles는 전통적 바이에른형의 비교점이다. Paulaner Münchner Hell, Hacker-Pschorr Münchner Gold, Schönramer Hell도 함께 비교할 이름들이다. 대표성을 설명하는 목록이지 맛의 순위는 아니다.</p>
<p>미국의 Bierstadt Lagerhaus는 전통 라거를 현대 크래프트의 주제로 삼은 사례이고, Goldfinger는 디코션·자연 탄산·수평 숙성 같은 공정을 생각할 때 참고할 양조장이다. 한국에서는 OBC의 헬레스 계열을 독일 수입품과 비교해 볼 수 있다. 국내 제품·시즌·수입품 도수는 실제 라벨을 확인한다.</p>
<p>디코션은 매시(곡물과 물의 혼합물) 일부를 끓여 되돌리는 방법이다. 몰트 표현에 영향을 줄 수 있지만, 그 공정 이름만으로 더 좋은 맥주라고 판단할 수는 없다. 충분한 숙성·발효 관리·신선한 유통도 함께 봐야 한다.</p>`},
 {id:'b4',title:'런던 포터에서 스타우트, 러시아 수출 맥주까지',sub:'Stout는 원래 ‘강하다’는 말이었다',source:['porter','stout','bock'],body:`
<p>18세기 초 런던의 포터는 대규모 상업 양조, 저장과 유통의 역사와 함께 성장했다. 현대의 English Porter는 그 긴 역사 가운데 오늘날 비교 가능한 한 범주다. 당시의 포터가 오늘의 검고 초콜릿 같은 맥주와 언제나 동일했을 것이라고 생각하면 안 된다.</p>
<p>Stout는 본래 강하다는 뜻으로 쓰였다. Stout Porter라는 표현에서 점차 Stout가 독립적인 이름으로 정착했다. 따라서 포터와 스타우트의 차이를 언제나 ‘볶은 보리 사용 여부’ 하나로 자르는 것은 역사적으로도 현대 제품을 읽을 때도 불완전하다.</p>
<div class="route"><span>Porter</span><i>→ 영향·분화</i><span>Stout Porter</span><i>→</i><span>Dry / Foreign Extra / Sweet / Oatmeal / Imperial</span></div>
<p>아일랜드의 Dry Stout는 마른 로스트, Foreign Extra Stout는 수출형의 농도와 강도, Sweet/Milk Stout는 유당 등에서 오는 단맛, Oatmeal Stout는 귀리의 질감을 생각하게 한다. Guinness Draught는 유명한 한 갈래이며 모든 스타우트의 시작점은 아니다.</p>
<p>영국의 강한 포터·스타우트는 러시아·발트해 수출과 연결됐다. Russian Imperial Stout라는 이름에는 이 기억이 남는다. 발트해 주변에서는 현지 발효 관행과 만나 Baltic Porter가 발전했고, 현대 사례 중 다수가 라거 효모를 사용한다. 같은 포터의 영향이 다른 발효 전통으로 들어간 것이다.</p>
<p>현대 Imperial Stout에서는 몰트 농도·알코올·카카오·에스프레소·감초·검은 과일과 상당한 쓴맛을 함께 본다. Samuel Smith Imperial Stout·Courage를 영국 맥락의 참고로, North Coast Old Rasputin을 미국의 기준으로, Great Divide Yeti·Bell’s Expedition·Oskar Blues Ten Fidy를 미국 크래프트의 확장 사례로 놓을 수 있다.</p>
<p>Fuller’s London Porter → Guinness Foreign Extra → Old Rasputin → Yeti는 비교 시음 순서다. 이 제품들이 차례로 서로를 낳았다는 실제 출시 계보를 뜻하지 않는다. 기본 로스트·잔당·홉을 먼저 익혀야 나중에 배럴의 역할이 선명해진다.</p>`},
 {id:'b5',title:'버번통이 맛의 재료가 되다',sub:'Bourbon County와 현대 BA Imperial Stout',source:['goose','firestone','bruery'],body:`
<p>Goose Island는 1992년 Greg Hall의 Bourbon County 양조를 현대 버번 배럴 스타우트의 중요한 출발점으로 설명한다. 양조장 1,000번째 배치와 버번통의 만남이라는 이야기는 이 장르를 이해하는 상징적 장면이다. ‘최초’ 표현은 양조장의 서술이라는 점을 붙여 읽어야 한다. 맥주와 나무통의 관계 자체는 훨씬 오래됐다.</p>
<p>이전 대화에는 1995년 Great American Beer Festival에서 적합한 분류를 찾기 어려웠던 일과 이후 병입 상품화 이야기도 포함돼 있다. 이런 일화는 당시 새로운 공정이 기존 스타일 분류를 흔들었다는 맥락을 보여준다. 세부 연혁은 원문 보존본과 연결 자료를 함께 확인할 수 있다.</p>
<p>핵심 변화는 나무통과 그 안에 먼저 들어 있던 술을 적극적으로 향미 설계에 활용한 데 있다. 스타우트의 커피·카카오·로스트·검은 과일 위에 통의 바닐라·오크·코코넛을 연상시키는 향, 버번의 흔적이 겹친다. 단순히 향이 많아지는 것보다 이 요소가 얼마나 잘 이어지는지 평가한다.</p>
<div class="route"><span>베이스 스타우트</span><i>＋</i><span>통 · 이전 술</span><i>＋</i><span>시간 · 블렌딩</span></div>
<p>좋은 비교 질문은 네 가지다. 로스트가 살아 있는가, 배럴 향이 베이스를 덮는가, 단맛과 알코올이 분리돼 튀는가, 마신 뒤 오크의 떫음과 여운이 어떻게 남는가. 도수가 높다는 사실 자체는 균형의 증거가 아니다.</p>
<p>배럴 숙성은 항상 품질을 높이는 과정도 아니다. 베이스 맥주와 맞지 않는 통, 과한 나무 추출, 산화나 오염이 문제를 만들 수 있다. 반대로 적절한 숙성과 블렌딩은 여러 통의 차이를 하나의 의도에 맞출 수 있다.</p>`},
 {id:'b6',title:'배럴 맥주의 여러 학파',sub:'Goose Island · Firestone Walker · Side Project · 현대 디저트형',source:['firestone','goose','bruery'],body:`
<p>Goose Island Bourbon County를 버번 배럴 스타우트의 역사적 기준점으로 놓고, 다른 양조장은 각자의 선택으로 비교하자. Founders KBS는 커피·초콜릿과 배럴의 결합, Firestone Walker Parabola는 로스트와 배럴의 균형을 관찰하기 좋다. Revolution Deth’s Tar는 고농도 배럴 맥주의 또 다른 참고점이다.</p>
<p>Side Project의 Derivation 계열은 작은 배치·통 선택·블렌딩을 비교할 이름이다. Bottle Logic의 여러 제품, WeldWerks Medianoche 계열은 바닐라·카카오·커피 등 재료와 배럴을 결합한 현대적 표현을 보여준다. 어느 양조장도 이 한 문장으로 전 제품을 대표하지는 않는다.</p>
<p>Non-adjunct는 보통 스타우트와 배럴에 집중하는 제품을 가리키는 애호가 표현이다. Adjunct 제품은 커피·바닐라·코코넛·메이플·향신료 같은 추가 재료를 쓴다. 일반 양조학에서 adjunct라는 말이 가진 넓은 뜻과 맥주 애호가들이 이 문맥에서 쓰는 뜻을 구분하자.</p>
<p>처음에는 재료를 덜 더한 BA 제품으로 기본 통의 표현을 배우고, 이후 첨가형으로 이동하는 편이 비교가 쉽다. 다만 향만 맡고 바닐라빈이 들어갔는지 통에서 바닐라 계열 향이 왔는지 확정할 수는 없다. 실제 원재료·양조 설명을 확인해야 한다.</p>
<p>Parabola의 빈티지마다 통과 도수가 달라질 수 있다. 이전 대화에 나온 2026년 Henry McKenna·Elijah Craig 통, 숙성 기간, 도수는 그 빈티지의 설명이지 Parabola 전체의 영구적인 사양이 아니다. 오늘의 페이지는 변하는 사양을 한 숫자로 고정하지 않는다.</p>
<p>배럴 맥주의 다음 갈래로 BA Barleywine, Old Ale, Wheatwine, Braggot를 볼 수 있다. 로스트를 덜어낸 몰트·밀·꿀의 표현이 통을 만나면 무엇이 바뀌는지 배우는 방향이다.</p>`},
 {id:'b7',title:'The Bruery를 따로 읽어야 하는 이유',sub:'Black Tuesday와 고도수 배럴 에일의 넓은 세계',source:['bruery','firestone'],body:`
<p>The Bruery는 고도수 벨기에식 에일의 관심, 배럴 숙성, 다양한 추가 재료의 실험을 함께 떠올릴 양조장이다. BA Imperial Stout만으로 외우면 Barleywine·Old Ale·Wheatwine·Braggot·Sour/Wild Ale·블렌딩 에일의 폭을 놓친다.</p>
<p>Black Tuesday는 초콜릿·당밀·카라멜·검은 과일·바닐라·버번·오크·알코올이 큰 밀도로 겹치는 대표작이다. 공식 2025 설명은 버번 배럴 12개월 이상, 19.1% ABV다. 이는 해당 빈티지의 수치이며 모든 Black Tuesday를 19.1%로 읽어서는 안 된다.</p>
<p>이전 대화에서 라이 배럴·스카치 배럴 변형과 커피·향신료·디저트 재료의 조합, 24k Tuesday의 당근 케이크 모티프까지 이야기했다. 이 사례들의 의미는 ‘더 센 맥주’만이 아니라 한 베이스를 통과 재료로 변주하는 방법이다. 특정 출시 연도·재료 목록은 개별 병 설명을 다시 확인한다.</p>
<p>양조장을 기억하는 짧은 비유를 쓰면 Sierra Nevada는 미국 홉 맥주의 기준, Russian River는 홉과 혼합발효 양쪽의 비교점, Goose Island는 버번 배럴 스타우트의 역사, Firestone Walker는 배럴 선택과 블렌딩, The Bruery는 고도수 배럴 에일의 실험을 떠올리게 한다. 이는 학습용 관점이며 객관적인 순위가 아니다.</p>
<p>Black Tuesday ↔ Parabola ↔ Bourbon County ↔ Side Project를 비교할 때는 농도·배럴·블렌딩의 인상을 나눠 적자. 가격·희소성·평점은 별도 칸에 둔다. 아주 높은 도수와 큰 병은 함께 나눠 적은 양으로 비교하는 편이 향미를 읽기 좋다.</p>`},
 {id:'b8',title:'영국의 페일 에일에서 미국 홉의 여러 갈래로',sub:'Pale Ale · IPA · West Coast · Double · Hazy',source:['bjcp','pliny','haze','sculpin'],body:`
<p>영국의 Pale Ale·Bitter·IPA를 먼저 몰트와 홉의 균형으로 보자. 밝게 건조한 몰트, 영국산 홉, 펍의 유통·캐스크 에일 문화가 함께 작동한다. IPA에는 수출 역사가 있지만, 인도행 항해를 위해 어느 한 사람이 완전히 새 맥주를 발명했다는 식의 단순한 전설만으로 읽기는 어렵다.</p>
<p>1970~80년대 미국 크래프트의 부흥은 미국산 홉의 감귤·솔·수지 향을 새롭게 전면에 세웠다. Anchor Liberty Ale(1975)과 Sierra Nevada Pale Ale(1980)은 중요한 참고점이다. 영국의 틀을 그대로 복제하기보다 새로운 원료와 취향으로 표현을 넓혔다.</p>
<p>미국 IPA는 여러 축으로 갈라진다. West Coast는 드라이한 끝·선명한 쓴맛·홉 향의 방향, Double/Imperial IPA는 강도와 도수의 방향이다. 두 분류는 서로 겹친다. DIPA 다음에 West Coast가 발명됐다는 일직선으로 그리면 실제 역사가 흐려진다.</p>
<p>Vinnie Cilurzo는 1994년 Blind Pig에서 Double IPA를 만들었고, Russian River의 Pliny the Elder는 2000년 DIPA 행사를 위해 탄생했다. 현재 양조장은 8%의 홉 중심 맥주로 소개하며 차갑게 보관해 신선하게 마시라고 안내한다.</p>
<p>뉴잉글랜드에서는 The Alchemist의 Heady Topper 등을 중요한 영감으로 삼는 흐름이 2010년대 Hazy IPA로 확산했다. Tree House·Trillium 같은 이름도 비교할 만하다. 홉의 과실 향, 부드러운 몸체, 체감 쓴맛의 균형을 달리한 갈래이며 West Coast를 대체한 상위 단계가 아니다.</p>
<p>Hazy의 탁함은 여러 단백질·폴리페놀 상호작용과 양조 선택에 연결된다. 단순히 효모를 일부러 띄운 맥주라고 외우지 말자. 드라이호핑, 효모·홉의 상호작용, 물의 조성도 향·질감에 영향을 준다. 탁한 색만으로 신선도나 품질을 보장할 수는 없다.</p>`},
 {id:'b9',title:'Sculpin — 샌디에이고 IPA의 선명한 기준점',sub:'원조 · Grapefruit · Hazy · Imperial을 구별하기',source:['sculpin','pliny'],body:`
<p>Ballast Point Sculpin은 양조장이 West Coast IPA로 소개하는 대표 제품이다. 공식 기본 사양은 7% ABV, 70 IBU. 감귤·솔·열대과일, 살구·복숭아·망고·레몬을 연상시키는 홉 향이 특징으로 제시된다.</p>
<p>Sculpin은 독가시가 있는 물고기의 이름이다. ‘sting’이라는 이미지는 맥주의 선명한 쓴맛과 연결된다. 향의 과일 느낌이 실제 과일 첨가를 뜻하는 것은 아니다. 홉만으로도 과일 향이 두드러질 수 있다.</p>
<p>Grapefruit Sculpin은 자몽을 더한 별도 변형이다. Hazy Sculpin과 Imperial Sculpin도 기본 Sculpin과 다른 제품이다. 이전 대화의 7%·40 IBU 또는 8.5%·70 IBU 같은 변형 수치는 개별 제품·시기에 묶인 값으로, 구매 시 실제 라벨을 확인하자.</p>
<p>Sierra Nevada Pale Ale → Sculpin → Pliny → Hazy IPA는 맛의 비교 순서로 사용할 수 있다. Pliny가 Sculpin에서 파생된 실제 출시 순서라는 뜻은 아니다. Sculpin과 Pliny의 차이에는 홉 설계뿐 아니라 도수·몰트·신선도도 개입한다.</p>
<p>한국에서 수입품을 비교할 때는 이름의 명성보다 포장일과 냉장 유통을 먼저 본다. 오래된 유명 IPA보다 신선하고 잘 만든 가까운 양조장의 IPA가 스타일을 배우는 데 더 명확할 수 있다.</p>`},
 {id:'b10',title:'벨기에 — 효모, 수도원, 자연발효의 서로 다른 역사',sub:'밀맥주 · 세종 · 수도원 에일 · 람빅을 나누어 이해하기',source:['belgian','saison','gueuze'],body:`
<p>벨기에를 한 가지 맛으로 묶기는 어렵다. Witbier의 밀·향신료, Saison의 농가 양조 배경, 수도원과 강한 에일 문화, 람빅의 자연발효와 블렌딩은 서로 다른 맥락을 가진다. 효모·미생물의 표현이 풍부하다는 공통 관심으로 연결할 수는 있다.</p>
<p>Hoegaarden은 Witbier, Saison Dupont는 세종, Westmalle Dubbel·Tripel은 두벨·트리펠의 비교점이다. 현대 Westmalle Tripel의 출발은 1934년의 맥주와 연결되며 이후 레시피도 발전했다. 두벨·트리펠을 단순히 원료 두 배·세 배 공식으로 외우지 않는다.</p>
<p>Duvel은 Belgian Golden Strong, Rochefort 10·Westvleteren 12는 Dark Strong을 공부할 대표 사례다. Trappist라는 생산 정체성과 스타일 분류는 다르다. 같은 수도원 문화 안에도 색·도수·효모 표현이 다르다.</p>
<p>Orval은 Brett의 역할과 병입 후 시간을 읽기 좋다. 모든 Brett 맥주가 강하게 시지는 않는다. 람빅은 자연발효와 장기 숙성의 전통을, 괴즈는 서로 다른 숙성 람빅을 조합하고 병내 발효하는 블렌딩을 본다. Cantillon, 3 Fonteinen, Boon은 비교할 이름이다.</p>
<p>Rodenbach Grand Cru 같은 플랜더스 레드·브라운 계열은 산미·과실·숙성과 혼합의 다른 전통을 보여준다. 독일의 Berliner Weisse·Gose는 또 다른 역사이며 현대에는 케틀 사워링으로 만든 제품도 많다. 산미라는 결과가 같다고 제조 과정이 같지는 않다.</p>
<p>BA 임스에서 괴즈·숙성 세종으로 관심을 넓힐 만한 이유는 숙성·통·블렌딩이라는 공통 질문이다. 그러나 맛은 크게 다르므로 취향이 자동으로 이어진다고 가정하지 않는다. 소량 시음으로 산미와 발효 향의 선호를 확인하자.</p>`},
 {id:'b11',title:'2020년대의 여러 방향과 양조장 읽는 법',sub:'전통 라거의 재조명과 배럴·재료 실험은 동시에 진행된다',source:['firestone','bjcp','storage'],body:`
<p>현대 크래프트에는 여러 움직임이 동시에 존재한다. Hazy IPA·디저트형 스타우트의 확장과 함께, 정교한 헬레스·체코 라거·전통 공정에 관심을 두는 양조장들도 눈에 띈다. 이를 세계 시장 전체가 한 방향으로 바뀌었다는 단정으로 받아들이지는 말자.</p>
<p>Italian Pils는 드라이호핑과 전통 필스너의 연결, West Coast Pils는 미국식 홉 표현과 라거의 연결을 살피기 좋다. Czech lager와 Lukr side-pull 탭은 맥주 자체뿐 아니라 따르는 방식·거품·서비스 문화도 풍미 경험에 관여한다는 점을 보여준다. 탭 장비가 별도의 발효 스타일은 아니다.</p>
<p>혼합·자연발효, 첨가 재료를 줄인 BA 스타우트, 특정 증류소의 통, 싱글 배럴, 여러 통의 블렌딩 등도 주요 학습 주제다. Firestone Walker의 배럴 프로그램처럼 스타우트·고도수 에일·변형 제품이 함께 존재하는 경우, 양조장 하나를 취향 하나로 환원하기 어렵다.</p>
<p>양조장 설명을 읽을 때는 ‘무슨 스타일인가 → 원료·발효에서 무엇을 골랐나 → 어느 통에 얼마나 있었나 → 무엇을 추가했나 → 어떻게 보관·서비스할까’ 순서로 묻는다. 브랜드 이름을 아는 것에서 만드는 선택을 읽는 쪽으로 한 단계 나아가는 방법이다.</p>
<p>수입 재고·릴리스 도수·IBU·첨가물·통은 변한다. 특히 이전 대화의 2026 빈티지 사양과 판매가는 영구적인 정보가 아니다. 이 페이지는 역사·분류를 중심으로 배우고 제품 숫자는 실물 라벨로 마무리하도록 설계했다.</p>`},
 {id:'b12',title:'한 잔을 읽는 법 — 맛의 원인과 신선도',sub:'IBU · ABV · 몰트 · 결점 · 보관 · 서빙',source:['storage','sculpin','helles','haze'],body:`
<p>ABV는 부피 기준 알코올 도수다. IBU는 쓴맛 관련 성분의 측정 지표지만 체감 쓴맛 점수는 아니다. 잔당·바디·탄산·온도·홉 향이 같은 숫자를 다르게 느끼게 한다. 색을 나타내는 SRM·EBC 역시 도수나 무게의 척도가 아니다.</p>
<p>몰트의 건조·볶음은 빵·토스트·카라멜·커피의 방향, 홉의 품종과 투입 시점은 쓴맛과 향, 효모와 발효 조건은 과실·향신료·드라이함에 관여한다. 드라이호핑은 보통 발효 중·후 홉을 넣어 향을 강조하는 과정이지 알코올을 제거한다는 뜻이 아니다.</p>
<p>젖은 종이 같은 산화 인상, 과한 버터 향, 빛에 노출된 맥주의 스컹크 같은 냄새, 거친 떫음은 점검할 단서다. 다만 미량의 특정 향이 스타일에 따라 허용되기도 하므로 낯선 향을 곧바로 결함으로 단정하지 않는다.</p>
<p>IPA와 일반적인 라거는 신선하게, 차갑고 어둡게 보관하는 쪽에 우선순위를 둔다. 고도수·배럴 숙성 맥주도 오래 둔다고 항상 좋아지지 않는다. 장기 숙성은 생산자가 권하는 제품을 별도로 선택해 병입일·보관 조건과 함께 기록하는 실험이다.</p>
<p>보관은 냉장고 3–5℃ 부근을 기본 운영안으로, 서빙은 가벼운 라거 5–8℃, 에일 8–12℃, 큰 배럴 맥주 12–16℃ 부근을 비교 출발점으로 제안한다. 제품과 취향에 맞춰 조절하며 고정 규칙으로 외우지 않는다. 냉장고의 선반 높이가 정확한 온도 구역을 보장하지 않으므로 온도계로 확인한다.</p>
<p>깨끗한 잔 두 개, 같은 양, 같은 온도, 하나의 질문이면 학습이 가능하다. 라거용 잔과 튤립잔, 고도수 시음용 작은 잔이면 충분하다. 시음 순서는 가볍고 향이 섬세한 맥주부터 시작하고, 큰 로스트·강한 산미·고도수는 별도 세션으로 나누자.</p>`}
];
const WHISKY_LESSONS=[
 {id:'w1',title:'맥주에서 위스키로 — 발효 뒤에 생기는 갈림길',sub:'곡물 → 당화 → 발효 → 증류 → 통 숙성 → 병입',source:['scotchlaw','swa','redbreast'],body:`
<p>두 술은 곡물의 전분을 당으로 바꾸고 효모가 발효한다는 공통 출발점을 가진다. 위스키는 그 발효액을 증류해 알코올과 향미를 농축하고 통에서 숙성한다. 보통 위스키용 발효액에는 맥주처럼 홉을 넣지 않는다. ‘위스키는 맥주를 증류한 술’은 출발을 이해하는 비유지만 시판 맥주와 같은 제조법이라는 뜻은 아니다.</p>
<p>몰팅은 곡물을 발아시킨 뒤 건조하는 과정이다. 당화는 전분을 발효 가능한 당으로 바꾸는 단계, 발효는 효모가 알코올과 여러 향 성분을 만드는 단계다. 증류기는 크기·모양·가열·환류·컷(받아낼 구간의 선택)에 따라 성격이 달라진다.</p>
<p>숙성에서는 오크 성분의 추출, 성분의 변화, 증발과 산소의 작용이 함께 일어난다. 통의 종류·크기·이력, 창고 환경, 도수가 모두 관여한다. 따라서 맛을 ‘원액 몇 퍼센트, 통 몇 퍼센트’의 고정 공식으로 나눌 수는 없다.</p>
<p>병입 때 통을 여러 개 섞거나 물로 도수를 조절하고 여과를 선택할 수 있다. 병 안에서는 통 숙성처럼 나무와 교환하며 연수가 늘어나지 않는다. 18년 병을 집에 5년 두어도 23년 숙성 위스키가 되는 것은 아니다.</p>`},
 {id:'w2',title:'역사 — 농가의 증류에서 블렌디드, 세계의 증류소로',sub:'기술과 유통이 스타일을 바꿨다',source:['swahistory','swa','yoichi'],body:`
<p>스코틀랜드와 아일랜드의 위스키에는 지역 농업·증류·과세의 긴 역사가 겹친다. 스코틀랜드에서는 허가 증류가 확대되는 과정과 19세기 연속식 증류 기술의 발전이 생산 규모와 스타일에 큰 영향을 줬다.</p>
<p>연속식 증류로 만든 그레인 원액과 풍미 있는 몰트를 조합한 블렌디드는 균일한 품질과 넓은 유통을 가능하게 했다. 오늘날 싱글 몰트가 애호가의 관심을 많이 받더라도 블렌디드를 하위 단계로 취급하면 위스키 산업의 중심 역사를 놓친다.</p>
<p>미국에서는 옥수수·라이 같은 곡물, 새 오크통과 지역 생산이 버번·라이의 성격을 만들었다. 스카치와 비교할 때 연수만 보는 대신 원료·통의 새것 여부·기후를 함께 봐야 한다. 새 오크와 더운 계절의 추출은 오랜 스코틀랜드 숙성과 단순 등가가 아니다.</p>
<p>일본은 스코틀랜드의 기술을 배우면서 자국 증류소들의 다른 원액과 블렌딩 설계를 발전시켰다. 하쿠슈와 요이치의 비교는 같은 일본 안에서도 허브·가벼운 연기와 묵직한 몰트·훈연이 다르게 나타날 수 있음을 보여준다.</p>
<p>대만·한국 등 새로운 생산국은 각자의 기후와 원료·증류·통 선택으로 표현을 넓힌다. Kavalan과 Ki One을 단순한 신생국 상징으로만 두기보다 기존 스카치와 같은 질문으로 비교하자. 높은 기온이 특정 성숙 효과를 빠르게 만들 수는 있어도 모든 장기 숙성 효과를 같은 속도로 재현한다는 뜻은 아니다.</p>`},
 {id:'w3',title:'라벨의 문법 — Single, Malt, Grain, Blend',sub:'병 하나를 읽으면 술장의 역할이 보인다',source:['swa','scotchlaw','royal','compass'],body:`
<p>스카치의 Single은 한 증류소라는 뜻이다. Single Malt는 그 증류소에서 맥아 보리를 원료로 단식 증류한 위스키이고, Single Grain은 같은 ‘단일 증류소’ 축에 속하되 싱글 몰트의 정의에 해당하지 않는 그레인 위스키다. Single Grain이 곡물 한 종류라는 뜻은 아니다.</p>
<p>Blended Malt는 서로 다른 증류소의 싱글 몰트를, Blended Grain은 서로 다른 증류소의 싱글 그레인을 섞는다. Blended Scotch는 몰트와 그레인을 함께 쓰는 범주다. 한 싱글 몰트도 여러 통을 섞어 일정한 스타일로 병입할 수 있다.</p>
<div class="two-col"><div class="mini-card"><h4>Royal Salute 21 Blended Grain</h4><p>그레인만의 블렌드. Signature Blend 21과 제품명 전체부터 구별.</p></div><div class="mini-card"><h4>Compass Box Orchard House</h4><p>몰트만의 블렌드. ‘혼합했으니 그레인이 들어간다’는 생각의 반례.</p></div></div>
<p>연수 표기는 스카치에서 가장 어린 구성 원액의 숙성연수다. NAS는 연수를 표시하지 않았다는 뜻이고 무숙성이라는 뜻은 아니다. Single Cask는 한 통의 병입, Cask Strength는 병입 도수에 관한 표현이므로 서로 다른 축이다.</p>
<p>Non-chill filtered는 냉각여과를 하지 않았다는 뜻, natural colour는 착색하지 않았다는 뜻이다. 이 선택들은 제품을 이해하는 정보지만 단독으로 맛의 우열을 결정하지 않는다. 실제 도수·병입 연도·통 번호까지 읽어야 같은 이름의 병을 정확하게 비교할 수 있다.</p>`},
 {id:'w4',title:'피트 — 강도보다 연기의 위치와 질감',sub:'Talisker · Caol Ila · Highland Park · Bowmore',source:['talisker','caol','hp','bowmore'],body:`
<p>피트는 이탄을 태운 연기로 맥아를 건조할 때 생기는 스모키한 성격과 연결된다. 연료의 특성, 건조 조건, 증류와 숙성, 병입 도수가 최종 표현을 바꾼다. 모든 아일라 위스키가 피티드인 것도 아니고 피트가 아일라에만 존재하는 것도 아니다.</p>
<p>PPM은 어떤 단계에서 측정한 페놀 지표인지부터 확인한다. 맥아의 수치가 잔 안에서의 자극을 그대로 예측하지 않는다. 높은 PPM을 곧 높은 품질로, 낮은 PPM을 곧 섬세함으로 읽는 것도 성급하다.</p>
<p>Talisker 18은 해안·후추와 과실, Caol Ila 18은 오일·모닥불·염분, Highland Park 18은 꿀·셰리 과실·연기, Bowmore 18은 과실과 스모크의 결합을 비교할 후보다. 이는 대표적인 관찰 방향이지 누구에게나 동일한 감각을 보장하는 표현은 아니다.</p>
<p>‘섬세하고 고급스러운 피트’는 연기가 약하다는 뜻보다 과실·몰트·알코올과 잘 엮이고 거칠지 않은 경험으로 정의하는 편이 유용하다. 18년이어도 자극이 있을 수 있고, 더 젊은 병이 오히려 취향에 잘 맞을 수도 있다.</p>
<p>24병에서는 Benromach 15와 Kilkerran 12로 스페이사이드·캠벨타운의 다른 결을 더한다. 기존 대화의 Ledaig 18은 흙·오일·야성적인 인상을 원하는 교체 후보, Port Charlotte 18은 예산을 크게 쓰기 전 시음할 후보로 남긴다. Octomore 같은 강한 표현을 기본안의 목표로 삼지는 않았다.</p>`},
 {id:'w5',title:'셰리와 와인 — 단맛보다 통의 이력을 읽기',sub:'꾸덕함 · 와인 실험 · 명성의 세 자리',source:['dronach','macallan','cuvee','tamdhu'],body:`
<p>셰리 캐스크를 이해할 때는 와인의 종류와 나무 종류를 분리한다. Oloroso·PX는 셰리의 종류, European oak·American oak는 목재의 축이다. 시즈닝·통의 재사용 횟수·숙성 기간도 영향을 준다. 셰리 캐스크라는 말만으로 당도·색·품질을 확정할 수 없다.</p>
<p>기존 요청의 세 역할을 유지했다. Glendronach 18은 졸인 과일·견과·초콜릿의 농밀함, GlenAllachie 2012 Cuvée는 서로 다른 와인 피니시의 결합, Macallan 18 Sherry Oak는 명성과 전통적 비교 기준의 자리다. 24병에서는 Tamdhu 15·Glenfarclas 25로 통의 표현과 긴 여운을 더 비교한다.</p>
<p>Macallan 18의 높은 가격에는 제품과 브랜드의 평가가 함께 들어간다. 그 역할을 원하면 한 자리를 줄 수 있지만 맛의 만족만 따지면 대안이 많다. Tamdhu 18은 기존 대화의 교체 후보이고, 단순히 예산을 낮추려면 Macallan 12 Sherry Oak도 비교의 출발점이 된다.</p>
<p>GlenAllachie Cuvée는 빈티지·출시별 통 구성이 달라질 수 있는 한정 제품이다. Sauternes 피니시는 꿀·살구 계열의 다른 비교 후보였다. 기존 대화의 Cuvée와 카발란 비노를 나란히 두는 이유는 와인통을 공유하는 듯 보여도 원액·통 처리·기후·도수의 방식이 다르기 때문이다.</p>`},
 {id:'w6',title:'원액과 지역 — 지도는 힌트이지 맛의 보증서가 아니다',sub:'Scotland · Ireland · America · Japan · Taiwan · Korea',source:['swa','deanston','clynelish','redbreast'],body:`
<p>스카치의 주요 지역 표기는 Highland, Lowland, Speyside, Islay, Campbeltown이다. Islands는 흔한 여행·향미상의 묶음이지만 이 다섯 법적 지역·지리표시와 같은 별도 항목으로 취급하지 않는다. Skye의 Talisker, Orkney의 Highland Park를 비교하면 섬이라고 모두 같은 맛이 아니라는 것도 알 수 있다.</p>
<p>Speyside=셰리, Islay=피트라는 암기는 첫 힌트일 뿐이다. Benromach의 스모크, 원액 중심 몰트, 같은 증류소의 다른 캐스크를 만나면 금세 예외가 생긴다. 나라·지역 다음에는 증류소와 제품명을 읽어야 한다.</p>
<p>Deanston 18의 몰트·꿀, Clynelish 14의 왁시한 질감, Orchard House의 사과·배는 강한 셰리·피트에서 잠시 떨어져 원액을 관찰하는 자리다. 헬레스에서 작은 차이를 보는 관심을 위스키에서 시험해 볼 수 있다.</p>
<p>Redbreast 15는 몰팅·비몰팅 보리를 함께 쓰는 Irish Single Pot Still, 세 차례 증류, 버번·Oloroso 통의 제품이다. 아일랜드 전체를 모두 세 번 증류한 부드러운 술이라고 묶지 말고 이 제품의 방식으로 배운다.</p>
<p>일본은 Hakushu 12와 Yoichi, 대만은 Kavalan Solist Vinho, 한국은 Ki One Batch 8 CS를 배치했다. Yamazaki 12는 이전에 검토한 인지도 높은 교체 후보다. 일본 브랜드를 모두 넣기보다 무엇을 비교할지 정해 한 자리를 교체하는 편이 중복을 줄인다.</p>`},
 {id:'w7',title:'버번 · 라이와 두 가지 오크 배합',sub:'Mash Bill과 Oak Bill을 혼동하지 않기',source:['maker','turkey','rye','broken'],body:`
<p>버번은 옥수수 중심의 곡물 배합과 새로 탄화한 오크통이라는 특징을 먼저 읽는다. 라이 위스키는 라이 곡물 중심의 별도 축이다. 스카치와 법적 기준이 다르므로 한 나라의 분류를 그대로 옮겨 적용하지 않는다.</p>
<p>Maker’s Mark의 밀을 쓰는 버번과 Wild Turkey Rare Breed를 비교하면 곡물 배합·증류소·도수의 차이를 관찰할 수 있다. ‘밀은 항상 달고 라이는 항상 매움’은 편리하지만 불완전한 일반화다. Michter’s US1 Rye는 라이도 둥글고 달콤한 부분을 가질 수 있다는 비교 후보다.</p>
<p>Broken Barrel은 통의 오크 판재를 사용하는 피니시로 Oak Bill을 강조한다. Mash Bill은 발효에 사용한 곡물 비율, Oak Bill은 사용한 오크의 구성에 관한 정보다. 사용한 프렌치 오크·버번통·셰리통 조각의 비율을 원액 비율로 오해하지 말자.</p>
<p>CS 버번은 상대적으로 적은 비용으로 진한 표현을 확보할 수 있어 전체 600만 원을 섬세한 피트·셰리 기준점에 더 배분하게 해준다. 다만 고도수로 감각이 지친 상태에서 섬세한 피트를 연이어 비교하면 차이가 가려질 수 있다.</p>`},
 {id:'w8',title:'시음과 보관 — 작은 양으로 차이를 남기기',sub:'물 한 방울, 같은 잔, 그리고 개봉 기록',source:['clynelish','maker','scotchlaw'],body:`
<p>니트로 조금 맛본 뒤 같은 병에 물을 소량 더해 향과 질감의 변화를 적는다. 정답인 가수 비율은 없다. 고도수와 낮은 도수의 병을 비교할 때는 차이를 도수 탓만으로 설명하지 않도록 같은 도수 부근의 비교도 시도할 수 있다.</p>
<p>한 세션은 두세 병을 각각 10–15ml 정도로 비교하는 계획부터 시작한다. 강한 피트·고도수·큰 셰리 뒤에는 섬세한 향이 잘 안 느껴질 수 있으므로 순서를 조절하고, 여러 주제로 나눠 기록한다.</p>
<p>향 세 단어, 입안의 질감, 끝맛, 다음에 비교할 병을 적으면 충분하다. ‘좋다’ 점수만 남기기보다 ‘Caol Ila의 오일과 Talisker의 후추 중 무엇이 좋았나’처럼 상대 차이를 적으면 다음 구매가 구체적이 된다.</p>
<p>위스키는 똑바로 세워 직사광선·열원·큰 온도 변화를 피한다. 장식 조명의 열과 맥주 냉장고의 방열이 선반을 덥히지 않게 한다. 개봉일과 잔량을 기록하고, 코르크·마개의 밀폐를 살핀다. 병을 장기간 눕혀 두는 와인식 보관을 그대로 적용하지 않는다.</p>
<p>24병을 모두 동시에 열 필요는 없다. 1차 기준 병을 열고 나머지는 비교 주제가 생길 때 개봉하는 것이 더 단순한 운영법이다. 장기적으로 24병을 유지하되 구매는 3단계로 나누면 처음의 취향 가설을 고칠 여유가 생긴다.</p>`}

const ARCHIVE = [{"title":"맥주 스타일 계보 설명","turns":[[{"role":"사용자","text":"헬레스, 베럴 에이지드 임스 등 관심 많은데 맥주 스타일 계보 근본부터 흐름, 현대까지 모두 스타일 브랜드 양조장 아울러서 설명"},{"role":"이전 답변","text":"말씀하신 **“배럴 에이지드 임스”는 Barrel-Aged Imperial Stout, 즉 BA Imperial Stout/BA RIS**로 이해하고 설명할게요.\n\n재미있는 건 **헬레스와 BA 임페리얼 스타우트가 정반대처럼 보이지만, 둘 다 ‘시간과 숙성으로 완성하는 맥주’**라는 점입니다. 헬레스는 아무것도 숨길 수 없는 극단적인 절제이고, BA 임스는 몰트·알코올·오크·증류주를 겹쳐놓고도 균형을 잡아야 하는 극단적인 과잉입니다. 이 두 스타일을 좋아한다면 맥주를 꽤 재미있게 파고들 수 있는 취향이에요.\n\nimage_group{\"layout\":\"carousel\",\"aspect_ratio\":\"1:1\",\"image_refs\":[\"turn247927image3\",\"turn247927image2\"]}\n\n## 1. 우선 맥주 전체를 이렇게 보면 된다\n\n맥주 스타일은 와인 품종처럼 완벽한 족보가 있는 건 아닙니다. **효모 + 몰트 + 홉 + 발효/숙성 기술 + 지역 문화**가 계속 섞이며 만들어진 분류입니다.\n\n가장 큰 지도는 이렇습니다.\n\n```text\n맥주\n│\n├─ ALE 계열 ─ 상면발효\n│   ├─ 영국\n│   │   ├─ Mild / Bitter / Pale Ale\n│   │   ├─ IPA\n│   │   └─ Porter → Stout → Imperial Stout\n│   │\n│   ├─ 벨기에\n│   │   ├─ Dubbel / Tripel / Belgian Strong\n│   │   ├─ Saison\n│   │   └─ Witbier\n│   │\n│   └─ 독일계 Wheat\n│       └─ Weissbier / Weizen\n│\n├─ LAGER 계열 ─ 하면발효 + 저온숙성\n│   ├─ Dunkel\n│   ├─ Bock → Doppelbock\n│   ├─ Vienna / Märzen / Festbier\n│   ├─ Czech Pilsner\n│   ├─ German Pils\n│   └─ Munich Helles\n│\n└─ Wild / Mixed fermentation\n    ├─ Lambic → Gueuze\n    ├─ Flanders Red/Brown\n    ├─ Berliner Weisse\n    └─ Gose\n\n그리고 그 위에\nBarrel-aged / Fruit / Coffee / Vanilla / Smoke / Dry-hop...\n같은 '공정·재료 레이어'가 올라간다.\n```\n\n여기서 중요한 포인트가 하나 있습니다. **Barrel-Aged는 Helles나 Porter처럼 족보상의 기본 스타일이 아니라 ‘처리 방식’에 가깝습니다.** Imperial Stout를 버번 배럴에 넣으면 BA Imperial Stout가 되고, Barleywine을 넣으면 BA Barleywine이 됩니다. 현재 Brewers Association도 wood/barrel-aged를 기저 스타일과 결합하는 별도 축으로 다룹니다. citeturn247927search0\n\n---\n\n# 2. 근대 맥주의 역사는 대략 세 번 크게 뒤집혔다\n\n| 시대 | 무슨 일이 벌어졌나 | 여기서 나온 핵심 |\n|---|---|---|\n| 중세~1600s | 지역별 에일·밀맥주·훈연맥주·산미 있는 맥주 | Weissbier, Gose 등의 먼 뿌리 |\n| 1700s 영국 | 몰트 제조·대형 상업 양조 발달 | Pale Ale, Porter |\n| 1700~1800s | Porter가 강해지고 여러 갈래로 분화 | Stout, Imperial Stout |\n| 1800s 중부유럽 | 하면발효·저온숙성 + 밝은 몰트 기술 | Lager 혁명 |\n| **1842** | 플젠에서 Josef Groll이 금색 라거 양조 | **Pilsner Urquell → Pilsner** citeturn756070search2turn899382search3 |\n| **1894** | 뮌헨 Spaten이 필스너에 대응 | **Munich Helles** citeturn756070search12turn568478search2 |\n| 1900s | 대기업 pale lager가 세계 시장 장악 | 오늘날 일반적인 ‘맥주’ 이미지 |\n| 1970~80s 미국 | 소규모 craft revival | American Pale Ale / IPA |\n| **1975** | Anchor Liberty Ale | 현대 American IPA의 중요한 출발점 citeturn899382search0 |\n| **1980** | Sierra Nevada Pale Ale | Cascade hop 중심 미국 크래프트의 교과서 citeturn303458search0 |\n| **1992** | Goose Island가 임페리얼 스타우트를 버번 배럴에 숙성 | **현대 Bourbon BA Stout의 출발점** citeturn303458search2turn303458search3 |\n| 2000s | DIPA, Imperial Stout, BA Beer 극대화 | Pliny, BCBS, Parabola 등 |\n| 2010s | Hazy IPA / pastry·adjunct stout / wild ale | 현대 크래프트 폭발 |\n| 2020s | 정교한 라거 회귀 + 고도화된 배럴 블렌딩 | Helles/Pils renaissance + 현대 BA |\n\n그래서 지금 맥주 세계는 사실 **“유럽의 수백 년 된 지역 맥주를 미국 크래프트가 다시 뜯어서 해석한 세계”**라고 보면 상당히 잘 맞습니다.\n\n---\n\n# 3. 헬레스 계보 — ‘단순한 라거’가 아니라 라거 기술의 끝\n\n헬레스 이전의 바이에른 라거는 기본적으로 **Dunkel처럼 어두운 맥주**가 중심이었습니다.\n\n그런데 1842년 보헤미아의 플젠에서 **Pilsner Urquell**이 등장합니다. 밝은 금색이고, Saaz hop이 뚜렷하며, 기존의 어두운 맥주와 시각적으로도 완전히 달랐습니다. citeturn899382search3\n\n뮌헨도 결국 대응합니다.\n\n**Dunkel → Pilsner의 충격 → Munich Helles**\n\nSpaten은 1894년에 뮌헨 양조장 최초로 필스너식 밝은 맥주를 만들었고 1895년 뮌헨 시장에 내놓았습니다. citeturn756070search12\n\n그런데 뮌헨 사람들은 체코 필스처럼 만들지 않았습니다.\n\n**Pilsner**\n→ 홉의 bitterness / crispness가 전면\n\n**Helles**\n→ Pilsner malt의 빵·곡물 맛이 전면  \n→ 홉은 뒤에서 받침  \n→ 부드러운 질감  \n→ 끝은 말끔하고 드라이\n\n헬레스가 단맛 나는 라거라는 뜻은 아닙니다. **‘몰티하지만 달지 않다’가 핵심**입니다. BJCP 기준도 4.7–5.4% ABV, 16–22 IBU 정도이며 German Pils보다 몰트와 바디가 크고 홉 캐릭터는 억제돼 있습니다. citeturn568478search2\n\n### 헬레스의 핵심 양조장\n\n| 양조장 | 맥주 | 의미 |\n|---|---|---|\n| **Spaten** | Münchner Hell | 역사적으로 스타일 탄생과 직결 |\n| **Augustiner-Bräu München** | Lagerbier Hell | 현재 뮌헨 헬레스의 대표적 기준점 |\n| **Weihenstephan** | Original Helles | 아주 정석적인 바이에른형 |\n| Paulaner | Münchner Lager/Hell | 대형 뮌헨 전통 |\n| Hacker-Pschorr | Münchner Gold | 고전적 헬레스 |\n| Schönramer | Hell | 맥주 애호가 쪽에서 좋은 비교 대상 |\n| **Bierstadt Lagerhaus** | Helles | 미국의 현대 전통 라거 부흥을 이해하기 좋은 사례 |\n\nAugustiner는 5.2%의 Lagerbier Hell을 현재도 생산하고, Weihenstephaner Original Helles는 5.1%, 21 IBU로 소개되고 있습니다. citeturn756070search3turn756070search1 미국에서는 Bierstadt처럼 “화려한 신재료”가 아니라 **디코션, 숙성, 발효 정밀도 자체를 크래프트로 보는 라거 전문 양조장**이 생겼습니다. citeturn712595search0\n\n한국 기준점을 하나 넣자면 **오리지널비어컴퍼니 OBC Lager Helles**도 현재 4.8%, 16 IBU의 헬레스로 생산되고 있어서 독일 수입품들과 옆에 놓고 비교해보기 좋습니다. citeturn712595search6\n\n---\n\n# 4. 헬레스 주변 스타일을 이렇게 구분하면 갑자기 쉽다\n\n| 스타일 | 가장 먼저 느낄 것 | 대표 |\n|---|---|---|\n| **Czech Pilsner** | 몰트 + Saaz + 둥글지만 선명한 쓴맛 | Pilsner Urquell |\n| **German Pils** | 더 드라이하고 날카로운 홉 | Jever, Bitburger |\n| **Helles** | 부드러운 Pils malt, 낮은 bitterness | Augustiner Hell |\n| **Dunkel** | 빵껍질·토스트·Munich malt | Ayinger Altbairisch Dunkel |\n| **Märzen** | 좀 더 진하고 토스트·몰트 | Ayinger Oktober Fest-Märzen |\n| **Festbier** | Märzen보다 밝고 가볍고 드링커블 | 현대 Oktoberfest 계열 |\n| **Bock** | 몰트 농도·알코올 상승 | Einbecker |\n| **Doppelbock** | 몰트가 거의 농축액처럼 깊어짐 | Ayinger Celebrator |\n\n따라서 **“헬레스가 좋다” → Pils / Dunkel / Festbier로 이동**하면 같은 독일·체코 라거 세계 안에서 취향이 어디에 있는지 알아낼 수 있습니다.\n\n---\n\n# 5. 반대편 대륙에서 Porter → Stout → Imperial Stout가 자란다\n\n여기가 BA 임스의 조상입니다.\n\n18세기 초 런던에서 **Porter**가 등장합니다. 당시의 Brown Beer보다 강하고 홉도 많고 오래 보관 가능한 형태로 진화했으며, 대규모 상업양조와 매우 밀접한 스타일이었습니다. BJCP도 Porter의 기원을 1700년대 초 런던으로 봅니다. citeturn899382search4\n\n중요한 사실은:\n\n**처음부터 Porter와 Stout가 완전히 다른 맥주였던 게 아닙니다.**\n\n원래 **stout = strong**에 가까운 표현이었고,\n\n**Porter → Stout Porter = 강한 Porter → Stout**\n\n식으로 명칭이 독립합니다.\n\n그 뒤 이런 분화가 일어납니다.\n\n```text\nPorter\n ├─ English Porter\n ├─ Baltic Porter   ← 북유럽에서 lager 계열로도 진화\n │\n └─ Stout\n     ├─ Irish / Dry Stout\n     ├─ Foreign Extra Stout\n     ├─ Sweet / Milk Stout\n     ├─ Oatmeal Stout\n     └─ Imperial Stout\n```\n\nGuinness가 대표하는 Dry Stout는 이 긴 역사에서 한 갈래일 뿐이고, **모든 Stout의 원형이 Guinness인 것은 아닙니다.**\n\n---\n\n# 6. Imperial Stout가 왜 ‘Russian Imperial’인가\n\n18세기 영국에서 강한 Porter/Stout가 해외 수출용으로 만들어졌고, 특히 러시아·발트해 시장 및 러시아 황실과 강하게 연관됩니다.\n\n그래서 후대에 **Russian Imperial Stout, RIS**라는 이름이 붙습니다. 현대 BJCP도 Imperial Stout를 “1700년대 러시아 수출용 강한 English Porter”에 뿌리를 둔 스타일로 설명합니다. citeturn568478search0\n\n현대 기준 Imperial Stout는 대략:\n\n**8–12%+ ABV  \n매우 높은 몰트 농도  \nroast / espresso / cacao / liquorice  \ndark fruit  \n상당한 bitterness  \n고알코올**\n\n입니다.\n\n고전 → 현대의 흐름을 마시면 꽤 잘 느껴집니다.\n\n| 단계 | 대표 |\n|---|---|\n| Porter | **Fuller's London Porter** |\n| Dry Stout | Guinness Draught |\n| Foreign Extra | Guinness Foreign Extra Stout |\n| 영국 Imperial Stout | Samuel Smith Imperial Stout / Courage |\n| 미국 초기 Imperial | **North Coast Old Rasputin** |\n| 미국 크래프트 정석 | **Great Divide Yeti / Bell's Expedition / Oskar Blues Ten Fidy** |\n| Barrel-Aged | **Goose Island Bourbon County Brand Stout** |\n\nBJCP 역시 Old Rasputin, Yeti, Expedition, Ten Fidy 등을 현대 American Imperial Stout의 대표 사례로 들고 있습니다. citeturn568478search0\n\n---\n\n# 7. 그리고 1992년, Imperial Stout + Bourbon이 만난다\n\n여기가 말씀하신 취향의 핵심입니다.\n\nChicago의 **Goose Island**에서 Greg Hall이 1992년 brewery의 1,000번째 batch를 기념하면서 강한 Imperial Stout를 **사용이 끝난 bourbon barrel**에 넣습니다.\n\n이것이 **Bourbon County Brand Stout**의 시작입니다. Goose Island는 이를 최초의 bourbon barrel-aged stout로 설명합니다. 1995년 Great American Beer Festival에 냈는데 당시에는 맞는 스타일 카테고리조차 없어 실격 처리되고 honorable mention을 받았습니다. 이후 2005년에 병입 상품으로 출시됩니다. citeturn303458search2turn303458search14\n\n이 사건이 엄청 중요합니다.\n\n기존의 나무통은 대체로 **저장 용기**였는데, 현대 미국 크래프트는 나무와 그 통에 전에 들어 있던 증류주 자체를 **적극적인 맛의 재료**로 보기 시작합니다.\n\n### Bourbon barrel이 Imperial Stout에 하는 일\n\nImperial Stout 자체의\n\n**espresso / cacao / roast / dark fruit**\n\n위에 배럴에서\n\n**vanilla / caramel / coconut / oak / char / tobacco / bourbon**\n\n이 올라옵니다.\n\n그리고 12~15%에 가까운 알코올이 이것들을 하나로 녹입니다.\n\n따라서 좋은 BA 임스는 단순히 **“진하고 달고 버번 냄새나는 맥주”**가 아니라,\n\n> stout → bourbon → oak → oxidation/aging\n\n네 층이 분리되지 않고 하나의 맛처럼 연결돼야 합니다.\n\n---\n\n# 8. BA Imperial Stout의 주요 계보\n\n**Goose Island Bourbon County**가 원점이라면 이후 미국 크래프트에서는 여러 학파가 생겼다고 보면 됩니다.\n\n| 계열 | 양조장/맥주 | 특징 |\n|---|---|---|\n| 원조 | **Goose Island – Bourbon County Brand Stout** | bourbon barrel 자체를 주인공으로 |\n| 고전 미국식 | Founders – KBS | coffee/chocolate + barrel |\n| 균형·배럴 중심 | **Firestone Walker – Parabola** | stout와 barrel의 정교한 integration |\n| 강렬한 미국식 | Revolution – Deth's Tar | 고농도 BA stout |\n| collector / small batch | Side Project – Derivation 계열 | barrel selection·blend 극대화 |\n| adjunct luxury | Bottle Logic 계열 | vanilla/coffee/cacao 등 적극 활용 |\n| 현대 maximalist | WeldWerks Medianoche 계열 등 | 고농도 base + barrel + adjunct |\n\n특히 **Firestone Walker Parabola**는 이 계보를 이해하기 좋은 맥주입니다. 2010년부터 독립 빈티지로 출시됐고, 현재 2026 Parabola도 생산되고 있습니다. 이번 버전은 10년 Henry McKenna와 9년 Elijah Craig 버번 배럴에서 12개월 숙성한 13%대 Imperial Stout입니다. citeturn937938search0turn937938search4\n\n여기서 현대 BA stout는 다시 갈립니다.\n\n**Non-adjunct BA Stout**  \n→ stout + barrel만으로 승부\n\n대\n\n**Adjunct BA Stout**  \n→ vanilla / cacao / coffee / coconut / maple / cinnamon 등 추가\n\n후자는 계속 극단화되면서 **Pastry Stout / Dessert Beer** 세계와 합쳐집니다. 아예 2026 Brewers Association 가이드에도 Dessert or Pastry Beer가 독립적으로 정의될 정도입니다. citeturn247927search0\n\n개인적으로 스타일을 이해하려면 **처음부터 adjunct 폭탄보다 non-adjunct를 먼저 마시는 게 훨씬 좋습니다.** 그래야 나중에 “이 바닐라는 실제 vanilla bean인가, bourbon barrel의 vanillin인가”까지 구분되기 시작합니다.\n\n---\n\n# 9. 한편 Pale Ale → IPA 쪽에서는 또 다른 미국 혁명이 일어난다\n\n영국:\n\n**Pale Ale → Bitter / IPA**\n\n미국으로 넘어오면서:\n\n**English Pale Ale  \n→ Anchor Liberty Ale (1975)  \n→ Sierra Nevada Pale Ale (1980)  \n→ American IPA  \n→ Double IPA  \n→ West Coast IPA  \n→ Hazy/NEIPA**\n\n가 됩니다.\n\nBJCP는 Anchor Liberty Ale을 현대 American craft IPA의 초기 기준으로 보고, Sierra Nevada Pale Ale은 American Pale Ale을 대중화한 결정적 맥주로 설명합니다. citeturn899382search0turn899382search2\n\nDouble IPA에서는 **Blind Pig의 Vinnie Cilurzo → Russian River → Pliny the Elder**라는 계보가 중요합니다. Russian River에 따르면 Vinnie는 이미 1994년 Blind Pig에서 Double IPA를 만들었고, 2000년 DIPA 행사에서 Pliny the Elder를 개발했습니다. citeturn303458search13\n\n그러다가 Vermont/New England에서 **The Alchemist Heady Topper**가 등장하면서 2010년대의 Hazy IPA 세계가 폭발합니다. BJCP 역시 Heady Topper를 현대 Hazy IPA의 주요 원형으로 지목합니다. citeturn899382search1\n\n---\n\n# 10. 벨기에는 아예 다른 문명이다\n\n독일이 **공정의 정밀함**, 영국이 **몰트와 홉의 상업적 진화**, 미국이 **증폭과 재해석**이라면 벨기에는 **효모와 발효의 복잡성**이 중심입니다.\n\n| 스타일 | 기준점 |\n|---|---|\n| Witbier | Hoegaarden |\n| Saison | **Saison Dupont** |\n| Dubbel | **Westmalle Dubbel** |\n| Tripel | **Westmalle Tripel** |\n| Belgian Golden Strong | **Duvel** |\n| Trappist/Belgian Dark Strong | Rochefort 10, Westvleteren 12 |\n| Brett 계열 | Orval |\n| Lambic | Cantillon |\n| Gueuze | **3 Fonteinen Oude Geuze / Cantillon Gueuze** |\n| Flanders Red | Rodenbach Grand Cru |\n\n특히 **Westmalle Tripel은 1934년에 처음 만들어진 현대 Tripel의 원형**입니다. citeturn899382search6\n\nLambic/Gueuze는 lager/ale 구분만으로 이해하면 안 되고, **야생 효모·박테리아 + 장기 숙성 + 블렌딩**이라는 전혀 다른 사고방식으로 봐야 합니다.\n\nBA stout 좋아하는 사람이 의외로 **Gueuze와 오래된 Saison에 빠지는 경우**가 이해되는 이유도 이것입니다. 맛은 정반대지만 둘 다 **숙성·배럴·블렌딩이 결과를 만드는 맥주**거든요.\n\n---\n\n# 11. 지금 2020년대 맥주 세계에서 벌어지는 일\n\n2010년대 중후반엔 “얼마나 홉을 많이 넣느냐, 얼마나 진하고 달게 만드느냐”가 크래프트의 한 축이었다면 지금은 그 반작용으로 **정밀함과 전통기술을 다시 보는 흐름**도 상당히 중요해졌습니다.\n\n그래서 현대의 흥미로운 축이:\n\n**Czech lager + Lukr side-pull  \nHelles  \ndecoction lager  \nItalian Pils  \nWest Coast Pils  \nmixed fermentation / spontaneous ale  \nnon-adjunct BA stout  \nbarrel blending  \nsingle/distillery-specific barrel**\n\n같은 방향입니다.\n\n예컨대 현대 미국의 Bierstadt는 아예 Helles와 장기숙성 Pils를 전면에 내세우고 있고, Goldfinger 같은 라거 전문 양조장은 decoction·natural carbonation·horizontal lagering 같은 고전 공정을 크래프트의 핵심으로 삼습니다. citeturn712595search7turn712595search4\n\n반대편 Firestone Walker의 2026 프로그램을 보면 Parabola 같은 순수 BA Imperial Stout에서 BA Barleywine, adjunct stout, Brett Saison까지 한 배럴 프로그램 안에 공존합니다. 현대 크래프트가 과거의 스타일들을 **‘재료’처럼 자유롭게 연결하는 단계**까지 왔다고 볼 수 있습니다. citeturn937938search11\n\n---\n\n# 12. 지금부터 마신다면 이 순서가 맥주 계보를 가장 빨리 몸으로 이해하게 해준다\n\n| 세션 | 순서 | 이유 |\n|---|---|---|\n| **라거 계보** | Pilsner Urquell → Spaten Hell → Augustiner Hell → Weihenstephaner Helles | Pilsner와 Helles가 왜 갈라졌는지 체감 |\n| **다크 에일 계보** | Fuller's London Porter → Guinness Foreign Extra → Old Rasputin → Yeti | Porter → Stout → Imperial을 체감 |\n| **BA 계보** | Imperial Stout → Bourbon County → Parabola → 현대 adjunct BA stout | barrel이 무엇을 더하는지 분리해서 학습 |\n| **벨기에** | Saison Dupont → Orval → Westmalle Tripel → Rochefort 10 | 효모가 맥주를 얼마나 바꾸는지 |\n| **야생발효** | Rodenbach → 3 Fonteinen → Cantillon | 산미·Brett·배럴·블렌딩 이해 |\n| **홉 계보** | Sierra Nevada Pale Ale → 전통 West Coast IPA → Pliny → Heady Topper/NEIPA | 미국 craft 40년을 한 번에 이해 |\n\n그리고 **지금 말씀하신 취향에서 제일 먼저 깊게 팔 만한 두 갈래는 `German/Czech lager`와 `Imperial Stout → Barrel-aged beer`입니다.** 이 두 축을 제대로 잡은 뒤 Saison/Lambic과 IPA 계보를 연결하면, 메뉴판에 처음 보는 맥주가 나와도 이름만 보고 대충 **“어디서 갈라져 나왔고 무엇을 의도하는 맥주인지”** 읽히기 시작합니다.\n\n원하시면 다음 답변에서 제가 아예 **「맥주 세계관 지도 1장」처럼 Helles·Pils·Dunkel부터 Porter·RIS·BA Stout·Lambic·IPA까지 모든 주요 스타일을 계통도 형태로 더 촘촘하게** 만들어드릴 수 있습니다."}],[{"role":"사용자","text":"스컬핀 ipa는 뭐지"},{"role":"이전 답변","text":"스컬핀 IPA는 **Ballast Point Brewing의 대표작이자, 샌디에이고식 West Coast IPA의 아주 유명한 기준점 중 하나**예요. 현재도 양조장이 아예 “flagship, award-winning, west coast IPA”라고 소개하고 있고, 도수는 7%입니다. 핵심 풍미는 **선명한 시트러스, 소나무, 열대과일 + 또렷한 쓴맛** 쪽입니다. citeturn700657search1turn700657search9\n\n계보로 놓으면 대략 이렇게 이해하면 됩니다.\n\n```text\nEnglish IPA\n→ 미국식 Pale Ale/IPA\n→ 1980~90년대 California IPA\n→ San Diego / West Coast IPA\n→ Sculpin IPA\n```\n\n즉, **Sierra Nevada Pale Ale → 초기 American IPA → 더 드라이하고 홉 향과 bitterness를 밀어붙인 캘리포니아 IPA** 흐름의 후대 대표주자 쪽입니다. Hazy IPA처럼 부드럽고 주시한 방향이 아니라, “IPA라면 홉이 이렇게 또렷해야지” 하는 구식(?) 미국식 미학에 더 가깝습니다.\n\n마시면 보통 **자몽 껍질, 레몬, 오렌지, 복숭아/살구, 약간의 망고 → pine/resin → 깔끔한 쓴 피니시**가 잡힙니다. 이름의 Sculpin은 독가시가 있는 물고기인데, 양조장 설명도 “맛있지만 sting이 있다”는 이미지에서 이름을 가져왔다고 합니다. citeturn700657search0turn700657search6\n\n그리고 예전에 한국에서 특히 유명했던 게 **Grapefruit Sculpin**입니다. 원래 Sculpin의 시트러스 홉 성격에 실제 자몽을 더한 버전이고, 현재 공식 스펙은 **7% / 70 IBU**입니다. 그래서 “자몽 IPA”가 유행하던 시절 상징적인 맥주 중 하나였어요. citeturn700657search2\n\n현재는 계열도 꽤 늘었습니다. 원조 Sculpin 외에 **Grapefruit Sculpin**, 더 부드럽고 탁한 **Hazy Sculpin(7%, 40 IBU)**, 그리고 강도를 높인 **Imperial Sculpin(DIPA, 8.5%, 70 IBU)** 등이 있습니다. citeturn700657search4turn700657search5\n\n아까 이야기한 전체 계보 안에서는 **Pliny the Elder보다 조금 더 대중적인 San Diego West Coast IPA의 교과서** 정도로 기억하면 좋아요.\n\n**Sierra Nevada Pale Ale → Sculpin → Pliny the Elder → 현대 West Coast IPA**\n\n이 네 병을 연달아 비교하면 미국 홉 맥주의 진화가 꽤 선명하게 보입니다."}],[{"role":"사용자","text":"더 브루어리는"},{"role":"이전 답변","text":"**The Bruery(더 브루어리)**는 아까 말한 BA Imperial Stout 계보에서 꽤 중요한 양조장입니다. 성격을 한마디로 잡으면 **“고도수 벨기에식 에일 + 배럴 에이징 + 디저트형 임페리얼 스타우트를 극단까지 밀어붙인 캘리포니아 양조장”**이에요.\n\n특히 대표작 **Black Tuesday**가 핵심입니다. 현재 버전도 버번 배럴에서 12개월 이상 숙성하고, 대략 **19% ABV** 수준까지 올라갑니다. The Bruery 자체 설명상 2025 Black Tuesday는 George Dickel, Elijah Craig, Henry McKenna, Heaven Hill 등의 배럴을 사용했고, 크렘 브륄레·무화과·밀크초콜릿 같은 방향을 노립니다. citeturn459736search5turn459736search8\n\n계보상으로는 이렇게 보면 됩니다.\n\n```text\nImperial Stout\n→ Goose Island Bourbon County Brand Stout\n   : “버번 배럴 + 스타우트”라는 문법 확립\n\n→ 2000년대 미국 BA Stout 확산\n   ├ Firestone Walker\n   ├ Founders\n   └ The Bruery\n\n→ The Bruery\n   : 도수↑ 농도↑ 배럴↑ 단맛↑\n     + 과일/향신료/커피/바닐라 등 adjunct 실험\n     \n→ 현대 Pastry / Dessert BA Stout\n```\n\n그래서 **Goose Island가 ‘원조’라면 The Bruery는 이 장르를 호화롭고 퇴폐적인 방향으로 확대시킨 주역 중 하나**라고 생각하면 정확합니다.\n\n### Black Tuesday를 기억하면 The Bruery가 보임\n\nBlack Tuesday는 그냥 검고 진한 스타우트라기보다 거의 **맥주로 만든 디저트 와인/포트/버번 리큐르**에 가까운 체급입니다.\n\n기본적으로:\n\n**초콜릿 → 당밀/카라멜 → 검은 과일 → 바닐라 → 버번 → 오크 → 뜨거운 알코올**\n\n이 엄청난 밀도를 하나로 합칩니다.\n\n그리고 여기서 파생형을 미친 듯이 만듭니다. 2026년 현재도 **Rye barrel Black Tuesday**, Scotch barrel 버전, 커피·향신료·디저트 재료를 더한 각종 변형이 나오고 있습니다. 예를 들어 2026 Black Tuesday Rye는 라이 배럴에서 오는 바닐라·베이킹 스파이스·다크초콜릿·과일가죽 쪽을 노립니다. citeturn459736search2turn459736search3\n\n심지어 **24k Tuesday**라는 버전은 Black Tuesday 베이스에 버번 배럴 숙성 후 **당근, 호두, 유당, 건포도, 향신료**를 넣어서 아예 carrot cake를 구현합니다. citeturn459736search4\n\n이게 정확히 현대 **Pastry Stout** 문법이에요.\n\n---\n\n그렇다고 The Bruery를 **“임스 만드는 곳” 하나로만 기억하면 조금 아깝습니다.**\n\n원래 이곳의 DNA에는 **Belgian Strong Ale, Old Ale, Barleywine, Sour/Wild Ale, 고도수 배럴 에일** 같은 게 강하게 들어 있습니다. 지금도 Imperial Stout뿐 아니라 barrel-aged blended ale, English-style barleywine, old ale, wheatwine, braggot 같은 별별 고도수 스타일을 계속 냅니다. 현재 BA 컬렉션만 해도 수십 종입니다. citeturn459736search0\n\n그래서 양조장 페르소나를 잡으면:\n\n**Sierra Nevada** = 미국 홉 맥주의 근본  \n**Russian River** = IPA + wild fermentation의 장인  \n**Goose Island** = Bourbon BA stout의 선구자  \n**Firestone Walker** = 배럴 블렌딩의 정교한 기술자  \n**The Bruery** = **고도수·배럴·퇴폐적 농도를 가지고 노는 실험실**\n\n정도로 외우면 좋습니다.\n\n그리고 지금 말씀하신 취향이면 **The Bruery는 상당히 중요한 양조장**이에요. 특히 BA 임스를 좋아한다면 다음 단계로 **Black Tuesday → Firestone Walker Parabola → Goose Island BCBS → Side Project**를 비교하면, 같은 BA stout 안에서도 *농도 중심 / 배럴 중심 / 블렌딩 중심*이 어떻게 달라지는지가 확 보입니다."}]]},{"title":"위스키 12병 조합 추천","turns":[[{"role":"사용자","text":"어느 정도 고가의 위스키 12병을 구매하려고 한다면 어떻게 채울 거 같아?\n상한은 300만 원 버젯.\n브로큰 배럴 cs랑 메막 cs 같은 버번 두 병, 메인으로는 섬세하고 고급스러운 피트 4종(옥토모어나 기타 자극적인 거 말고), 쉐리 셋(와인 캐스크 같은 특이한 거, 꾸덕한 향, 또 명성 높은 거), 블렌디드도 로얄살루트 21년 그레인 같은 거 한 병, 카발란이나 일본 위스키나 한국 위스키로 남은 두 병, 이런 느낌\n\n이 정도 비중일 때 여러 옵션과 조합 탐색, 술장 주인장의 페르소나 설정해서"},{"role":"이전 답변","text":"이 비중이면 꽤 멋있게 나옵니다. 제가 잡을 **술장 주인장 페르소나**는 이쪽이에요.\n\n> **“강한 맛을 수집하는 사람이 아니라, 숙성으로 정제된 맛을 수집한다.”**  \n> 피트는 ppm 경쟁 대신 오래 숙성되어 연기가 질감처럼 녹아든 것. 쉐리는 단맛만 세기보다 캐스크의 서로 다른 표현. 버번은 미국식 고도수의 재미를 값싸게 확보. 그리고 한 병 정도는 명성과 상징성에도 돈을 쓴다.\n\n이 관점에서라면 저는 우선 아래 12병을 기준안으로 잡겠습니다. **2026년 9월 9일 현재 확인되는 국내 노출가를 넣으면 약 294~295만 원**이라 예산에도 상당히 예쁘게 들어옵니다.\n\n### 제가 가장 먼저 만들 조합\n\n| # | 역할 | 병 | 대략가 | 이 술장에서의 의미 |\n|---|---|---|---:|---|\n| 1 | 버번 / 변칙 | **Broken Barrel Cask Strength** | 9.5만 | 오크 빌, 고도수, 과일·스파이스. 전통 버번과는 살짝 다른 출발점 |\n| 2 | 버번 / 정석 | **Maker's Mark Cask Strength** | 8.9만 | 밀 버번 특유의 부드러운 단맛 + CS. 브로큰 배럴과 좋은 대비 |\n| 3 | 피트 / 해안 | **Talisker 18** | 29.9만 | 후추·바다·연기가 18년 숙성으로 정제된 타입 |\n| 4 | 피트 / 미니멀 | **Caol Ila 18** | 35.6만 | 화려함보다 허브·오일·은은한 연기. 이 술장의 ‘주인장 취향’ 병 |\n| 5 | 피트 / 헤더 | **Highland Park 18** | 29.9만 | 헤더꿀·다크프루트·부드러운 오크니 피트 |\n| 6 | 피트 / 과실 | **Bowmore 18 구형** | 17.8만 전후 | 과일·초콜릿에 연기가 얹힌 우아한 아일라 |\n| 7 | 와인 캐스크 | **GlenAllachie 2012 Cuvée Wine Cask Finish** | 15만 | 레드커런트·커피·다크초콜릿. “쉐리 아닌 와인 캐스크는 어떻게 다른가” |\n| 8 | 꾸덕 쉐리 | **GlenDronach 18** | 31.8만 | 졸인 과일·호두·초콜릿. 쉐리 농밀함 담당 |\n| 9 | 명성 쉐리 | **Macallan 18 Sherry Oak** | 47.9만 | 가격 대비 효율보다 ‘기준점’. 다른 쉐리들을 비교할 축 |\n| 10 | 그레인 | **Royal Salute 21 Blended Grain** | 19.9만 | 21년 그레인만으로 꿀·바닐라·크림. 몰트 일색을 끊어주는 병 |\n| 11 | 대만 | **Kavalan Solist Vinho Barrique CS** | 29.5만 | 열대 숙성 + 와인 배럴 + CS. 스카치와 완전히 다른 숙성 철학 |\n| 12 | 한국 | **Ki One Batch 8 CS** | 18.4만 | 한국 위스키의 현재를 넣는 ‘시대 기록’ |\n\n**합계 약 294.5만 원.**\n\n버번 두 병은 현재 브로큰 배럴 CS가 9.5만~11.5만 원, 메이커스 마크 CS가 약 8.7~8.9만 원이라 예산을 거의 먹지 않습니다. citeturn175770search1turn175770search0turn920264search2\n\n피트 쪽은 탈리스커 18이 29.9만 원, 쿨일라 18이 현재 35.58만 원, 하이랜드 파크 18 구형이 29.9만 원 수준이고, 보모어 18 구형은 17.8만 원대 노출도 있습니다. 특히 쿨일라 18의 허브·몰트·오일·부드러운 스모크와 탈리스커 18의 약해진 피트와 긴 피니시가 지금 말씀하신 **“옥토모어식 자극 말고 고급스러운 피트”**에 아주 잘 맞습니다. citeturn820276search13turn738969search10turn311622search0turn905249search2\n\n쉐리/와인 세 병은 의도적으로 역할을 갈랐습니다. 글렌알라키 2012 뀌베는 와인향이 상당히 전면에 나오는 특이한 48% 병이고 현재 15만 원대도 보입니다. 글렌드로낙 18은 31.8~31.9만 원에 졸인 과일·호두·초콜릿 계열, 맥캘란 18 셰리 오크 2026은 약 47.9만 원이라 세 병을 같이 놓으면 **실험 → 농밀함 → 정통/명성**이라는 구도가 생깁니다. citeturn468947search7turn468947search13turn607489search7\n\n그리고 말씀하신 로얄살루트 21은 실제로 **Blended Grain** 별도 제품이 맞습니다. 최소 21년 이상 숙성한 그레인 원액을 블렌딩한 제품이고 현재 약 19.9만 원 노출가가 확인됩니다. 몰트와 달리 크림·꿀·바닐라·오크 쪽이라 12병 중 아주 좋은 환기점이에요. citeturn387784search0turn387784search6\n\n마지막 카발란 비노 CS는 약 29.5~29.9만 원, 기원 배치 8 CS는 18.4~19.4만 원대입니다. citeturn607489search4turn175770search6\n\n### 특히 마음에 드는 건 피트 네 병의 구도\n\n여기서 **라가불린 16을 일부러 안 넣은 것**도 중요합니다. 라가 16 자체는 훌륭하고 현재 14만 원대까지 내려와 있지만, 12병짜리 ‘조금 고급스러운 술장’에서 네 자리뿐인 피트 슬롯 하나를 차지하기엔 너무 익숙한 기준점입니다. citeturn820276search0\n\nTalisker 18 → **소금·후추·해안**  \nCaol Ila 18 → **투명·허브·오일**  \nHighland Park 18 → **꿀·쉐리·헤더 연기**  \nBowmore 18 → **과실·초콜릿·부드러운 아일라**\n\n이렇게 하면 네 병 모두 피트인데 **“연기 맛 네 개”가 전혀 아닙니다.**\n\n그리고 저는 여기서 **Ledaig 18을 1순위에는 안 넣겠습니다.** 좋은 술이고 약 25~26만 원으로 훌륭하지만, 흙·약품·짭짤함·오일이 꽤 개성 있게 튀어서 ‘섬세한 고급 피트’라기보다는 ‘잘 숙성된 야성적인 피트’에 가깝습니다. 대신 개성을 더 원한다면 Bowmore를 빼고 Ledaig 18을 넣으면 술장 성격이 확 nerdy해집니다. citeturn905249search0\n\n### 여기서 취향별로 조정한다면\n\n| 바꾸고 싶은 성격 | 교체 | 결과 |\n|---|---|---|\n| **더 매니악하게** | Bowmore 18 → **Ledaig 18** | 과실 중심에서 흙·염분·펑키함으로 |\n| **피트의 최고급 병 하나** | Bowmore 18 → **Port Charlotte 18 (2026)** | 약 58.5만 원이라 예산 재조정 필요. 40ppm이지만 18년 숙성으로 상당히 정제됨 citeturn738969search1turn738969search4 |\n| **쉐리 브랜드 프리미엄 싫음** | Macallan 18 → **Tamdhu 18** | 약 41.9~42.3만. 순수 셰리 캐스크 자체를 더 보는 술장 citeturn607489search13 |\n| **와인 캐스크를 더 달게** | GlenAllachie Cuvée → **GlenAllachie 12 Sauternes** | 꿀·사탕·살구. 다만 약 32만이라 가격은 크게 상승 citeturn468947search3 |\n| **일본 간판이 꼭 필요** | Kavalan → **Yamazaki 12** | 현재 약 34.5~38.4만. 술장 인지도는 확 올라가지만 가성비는 떨어짐 citeturn920264search6turn920264search0 |\n| **일본도 피트 결로** | Kavalan → **Hakushu 12** | 솔잎·바질·녹차·미묘한 스모크. 다만 국내가가 약 35~45만이라 상당히 비쌈 citeturn311622search16turn311622search10 |\n\n제가 이걸 실제 제 술장처럼 산다면 **맥캘란 18은 남깁니다.** 맥캘란을 무조건 좋아해서가 아니라, 글렌드로낙 18과 나란히 열었을 때 “명성/브랜드 프리미엄까지 포함한 셰리의 기준점” 역할이 아주 좋기 때문입니다.\n\n반대로 **야마자키 12는 뺍니다.** 35만 원 이상을 쓰고 얻는 맛의 독창성이 이 구성에서는 카발란 비노 CS보다 작다고 보기 때문입니다. 카발란을 넣어야 GlenAllachie Cuvée와도 비교가 됩니다. 똑같이 와인이 개입하지만 **스코틀랜드 장기 숙성 vs 대만 고온 숙성 + CS**라는 재미있는 대조가 생기거든요.\n\n그래서 이 술장은 결국 이런 주인으로 보입니다.\n\n**“피트를 좋아하지만 센 걸 자랑하지 않고, 쉐리를 좋아하지만 단 것만 좇지 않으며, 맥캘란도 사고 기원도 산다. 오래된 권위와 새로운 제조법을 같은 선반에 놓고 비교해서 마시는 사람.”**\n\n개인적으로는 이 페르소나가 지금 말씀하신 취향에서 꽤 정확해 보여요.\n\n원하면 다음 답변에서는 여기서 더 재밌게 들어가서 **① 300만 원 내 최종 조합 3안 — ‘귀족형 / 매니악형 / 캐스크 덕후형’**으로 12병씩 아예 서로 다르게 짜볼게요."}]]}];
